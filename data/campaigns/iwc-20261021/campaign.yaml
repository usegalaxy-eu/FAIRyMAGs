steps:
- name: bee-gut.quality_control
  use_case: bee-gut
  workflow: qc
  inputs:
    Raw reads:
      id: 289496bfe878b9d8
      src: hdca
      history_id: 11ac94870d0bb33a60eb0c886213fc71
  parameters:
    Adapter to remove on forward reads: null
    Adapter to remove on reverse reads: null
    Qualified quality score: 15
    Minimal read length: 15
  required_outputs:
  - fastp trimmed reads
- name: bee-gut.contamination_removal
  use_case: bee-gut
  workflow: host
  inputs:
    Short-reads:
      step: bee-gut.quality_control
      output: fastp trimmed reads
  parameters:
    Choose Reference Genome: Use a built-in genome index
    Host/Contaminant Reference Genome: apiMel3
  required_outputs:
  - Contamination Filtered Reads from Local Index
- name: bee-gut.mags_single
  use_case: bee-gut
  workflow: parent
  inputs:
    Trimmed reads: &id001
      step: bee-gut.contamination_removal
      output: Contamination Filtered Reads from Local Index
  parameters:
    Choose Assembler: MEGAHIT
    Minimum length of contigs to output: 200
    Environment for the built-in model (SemiBin): global
    Run COMEBin: true
    Minimum MAG completeness percentage: 0
    Contamination weight (Binette): 2
    CheckM2 Database: 1.0.2
    Minimum MAG length: 50000
    Maximum MAG contamination percentage: 100
    ANI threshold for dereplication: 0.95
    Use grouping?: Use original samples
    Binning strategy: Single-coverage binning (own/merged reads)
    Bin refinement tool: Binette
    Run SemiBin?: true
    Run CONCOCT?: true
    Run MetaBAT2?: true
    Run MaxBin2?: true
  required_outputs:
  - Dereplicated Bins
- name: bee-gut.taxonomy_single
  use_case: bee-gut
  workflow: taxonomy
  inputs:
    Sequence collection:
      step: bee-gut.mags_single
      output: Dereplicated Bins
  parameters:
    GTDB-Tk Database: full_database_release_226_downloaded_2026-02-25
    MAGs taxonomic classification with kMetaShot (optional): true
    kMetaShot Database: '2025-05-22'
    ass2ref for kMS: 0.0
  required_outputs:
  - GTDB-Tk summary files
  - full GTDB to NCBI mapping
- name: bee-gut.genome_annotation_single
  use_case: bee-gut
  workflow: genome
  inputs:
    Bacterial Genomes:
      step: bee-gut.mags_single
      output: Dereplicated Bins
  parameters:
    Plasmid detection database: plasmidfinder_81c11f4_2023_12_04
    Bacterial genome annotation database: V5.1_2024-01-19
    AMRFinderPlus database: amrfinderplus_V3.12_2024-05-02.2
    Run Bakta: true
  required_outputs:
  - PlasmidFinder Merged Summary
  - bakta cut annotation summary
  - Integron Finder Merged Output
  - ISEScan Merged Output
- name: bee-gut.functional_annotation_single
  use_case: bee-gut
  workflow: functional
  inputs:
    Sequence collection:
      step: bee-gut.mags_single
      output: Dereplicated Bins
  parameters:
    Run eggNOG + completeness calculation: true
    eggNOG mode select: metagenome
    Run InterProScan: true
    InterProScan mode select: DNA/RNA
    Generate eggNOG annotation abundance tables: true
  required_outputs:
  - interproscan tabular
  - kegg contig table
  - eggNOG-mapper annotation abundance table
